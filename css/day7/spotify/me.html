<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./1.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <nav class="h-[64px] bg-black flex justify-between">
      <!-- section1 -->
      <section>
        <div
          class="flex justify-center items-center border-2 text-white w-[100px] h-full"
        >
          <i class="fa-brands fa-spotify text-4xl"></i>
        </div>
      </section>
      <!-- section2 -->
      <section
        class="flex justify-start border-2 gap-2 items-center text-white w-[500px]"
      >
        <div>
          <i
            class="fa-solid fa-house bg-[#2a2a2a] rounded-4xl text-2xl w-[80px] h-[30px] items-center"
          ></i>
        </div>
        <div class="flex items-center bg-[#2a2a2a] rounded-2xl">
          <i class="fa-solid fa-magnifying-glass pl-2"></i>
          <input
            type="text"
            class="outline-none w-[350px] h-[40px] pl-3"
            placeholder="What do you want to play?"
          />
          <p>|</p>
          <p><i class="fa-regular fa-clone m-3"></i></p>
        </div>
      </section>
      <!-- section3 -->
      <section
        class="flex justify-between items-center w-[600px] border-2 text-white"
      >
        <span class="">Premium</span>
        <span class="">Support</span>
        <span class="">Download</span>
        <span class="">|</span>
        <span class="flex gap-2"
          ><p><i class="fa-regular fa-circle-down"></i></p>
          <p>Install App</p></span
        >
        <span
          class="bg-white text-black w-[90px] h-[45px] items-center font-extrabold flex justify-center rounded-full m-3"
          >Log in</span
        >
      </section>
    </nav>
    <aside></aside>
    <section>
      <div></div>
      <div></div>
    </section>
  </body>
</html>
