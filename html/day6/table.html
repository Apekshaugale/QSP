<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      th,
      td {
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <table
      border="1"
      style="border-collapse: collapse; width: 100%; text-align: center"
    >
      <thead>
        <tr>
          <th>Product Name</th>
          <!--(td= is use to take tabledata) (tr for table row) ,border is used to take width ,padding is sapce between border and content we use style for padding-->
          <th>Price</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Mobile</td>
          <td>79,999</td>
        </tr>
        <tr>
          <td>AC</td>
          <td>56,7377</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
